# Конфигурация стратегии роутинга.
# Меняется без правки кода — так решается критерий "параметры можно менять
# через настройки/конфигурацию без изменения основной логики".

# Имя self-provider (fallback, если весь внешний пул отказал/недопустим).
# Задано конфигом, а не хардкодом в lib/ — решение не привязано к конкретному
# набору входных данных.
self_provider_name: spacepayments

# Веса, с которыми soft-goals совместно учитываются при ранжировании
# провайдеров внутри пула, прошедшего hard-constraints (см. lib/strategy_scorer.rb).
weights:
  count_share_gap: 1.2    # недобор целевой доли по количеству заявок (traffic_percentage) — стратегия 1, приоритетный сигнал
  volume_share_gap: 0.5   # недобор целевой доли по объёму (volume_share_pct, считается из истории) — стратегия 2, вторичный
  conversion: 0.5         # чем выше conversion_24h, тем выше приоритет — стратегия 5
  cascade_priority: 0.6   # чем меньше priority, тем выше приоритет (каскад) — стратегия 3
  turnover_min_gap: 1.5   # недобор дневного минимального оборота — стратегия 7
  amount_band: 0.4        # бонус за попадание суммы в предпочтительный диапазон — стратегия 4
  load_headroom: 0.2      # запас до лимитов после этой заявки — стратегия 6, загрузка влияет на выбор, а не только на допуск
  margin_advantage: 0.3   # комиссия провайдера: среди допущенных выгоднее тот, кто оставляет площадке больше маржи

# Стратегия 4: диапазоны суммы влияют на выбор как soft-бонус (не как hard-ограничение —
# hard остаётся limit_amount_min/max у самого провайдера). Порядок важен: берётся первый
# band, под max_amount которого подходит сумма заявки.
amount_bands:
  - max_amount: 50000
    prefer: payflow
  - max_amount: 100000
    prefer: vipay
  - max_amount: null
    prefer: quickpay

# Бизнес-параметры, которых нет в providers.json (стратегии 6 и 7).
# Не выводятся из истории напрямую (история не даёт таймстемпов внутри минуты
# и явных финансовых обязательств) — заданы как разумное приближение к реальности.
# ВОПРОС НА ЧЕКПОИНТ: подтвердить у экспертов, что такой подход к недостающим
# полям (сами придумываем, документируем) — то, что ожидается по ТЗ.
provider_overrides:
  vipay:
    requests_per_minute_limit: 20
    daily_turnover_min: 1500000
  payflow:
    requests_per_minute_limit: 15
    daily_turnover_min: 2000000
  quickpay:
    requests_per_minute_limit: 30
    daily_turnover_min: 0
  spacepayments:
    requests_per_minute_limit: null
    daily_turnover_min: 0

# Стратегия 6: текущая загрузка влияет на ВЫБОР, а не только на допуск.
# Штраф начинается только за порогом — различать провайдера на 15% и на 65%
# занятости смысла нет, значение имеет подход вплотную к лимиту.
# В этом кейсе порог задевает payflow: 2.9 млн из 3 млн дневного лимита уже
# израсходовано, то есть он входит в очередь на 97% загрузки.
load:
  pressure_threshold_pct: 80

simulation:
  seed: 20260905                    # фиксирован -> прогон воспроизводим при перепроверке
  provider_decline_base_rate: 0.04  # базовая вероятность технического отказа уже выбранного провайдера

# Сверка заявленной конверсии с исторической.
# conversion_24h в providers.json — это то, что провайдер о себе заявляет.
# По operations_history.csv payflow заявляет 91%, а фактически проводит 47.4%
# на 19 операциях — расхождение 43.6 п.п. Слепо верить снапшоту нельзя, но и
# выбрасывать его тоже: при малой выборке история сама шумит.
# Поэтому в скоринге используется сглаженная оценка — декларация входит как
# prior_strength "виртуальных наблюдений" против фактических из истории.
conversion:
  prior_strength: 10   # 0 — верить только истории; большое значение — только декларации
